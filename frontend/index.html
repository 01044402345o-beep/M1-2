<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>환율 AI 비서</title>
  <meta name="description" content="내 원/달러 환율 데이터를 이해하고 답하는 AI 비서" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💱</text></svg>" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // 깜빡임 방지: 저장된 테마를 렌더링 전에 적용
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">₩</span>
      <div>
        <h1>환율 AI 비서</h1>
        <p class="sub">내 원/달러 환율 데이터를 아는 AI</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="server-status" class="pill pill-wait" title="백엔드 서버 상태">서버 확인 중…</span>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="다크 모드 전환">🌙</button>
    </div>
  </header>

  <div id="wake-banner" class="banner" hidden>
    ⏳ 무료 서버(Render)가 잠들어 있어 깨우는 중입니다. 첫 요청은 최대 1분 정도 걸릴 수 있어요.
  </div>

  <main class="container">
    <!-- 데이터 요약 -->
    <section class="summary" aria-labelledby="summary-title">
      <div class="section-head">
        <h2 id="summary-title">데이터 요약 <small>AI 답변에 주입되는 정보</small></h2>
        <button id="summary-refresh" class="ghost-btn" type="button">새로고침</button>
      </div>
      <div id="summary-cards" class="cards">
        <div class="card skeleton"></div><div class="card skeleton"></div>
        <div class="card skeleton"></div><div class="card skeleton"></div>
      </div>
      <p id="summary-trend" class="trend"></p>
    </section>

    <nav class="tabs" role="tablist">
      <button class="tab active" role="tab" data-tab="chat" aria-selected="true">💬 채팅</button>
      <button class="tab" role="tab" data-tab="data" aria-selected="false">📊 데이터 관리</button>
      <button class="tab" role="tab" data-tab="history" aria-selected="false">🗂 대화 기록</button>
    </nav>

    <!-- 채팅 -->
    <section id="tab-chat" class="panel" role="tabpanel">
      <div class="chat-head">
        <span id="chat-title" class="chat-title">새 대화</span>
        <button id="new-chat" class="ghost-btn" type="button">+ 새 대화</button>
      </div>
      <div id="messages" class="messages" aria-live="polite">
        <div class="empty-chat">
          <p>환율 데이터에 대해 무엇이든 물어보세요.</p>
          <div class="chips">
            <button class="chip" type="button">요즘 환율 추세가 어때?</button>
            <button class="chip" type="button">가장 환율이 높았던 때는 언제야?</button>
            <button class="chip" type="button">이번 달 평균은 지난달보다 어때?</button>
            <button class="chip" type="button">2026년 3월 첫째 주 환율 알려줘</button>
            <button class="chip" type="button">최근 변동성은 어느 정도야?</button>
          </div>
        </div>
      </div>
      <form id="chat-form" class="chat-form">
        <textarea id="chat-input" rows="1" maxlength="1000" placeholder="질문을 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)" required></textarea>
        <button id="chat-send" class="primary-btn" type="submit">전송</button>
      </form>
    </section>

    <!-- 데이터 관리 -->
    <section id="tab-data" class="panel" role="tabpanel" hidden>
      <div class="chart-box">
        <div class="section-head">
          <h3>추세 그래프 <small>일별 값 · 7일/30일 이동평균</small></h3>
          <div id="stats-mini" class="stats-mini"></div>
        </div>
        <div class="chart-wrap"><canvas id="chart" aria-label="환율 추세 그래프"></canvas></div>
      </div>

      <form id="data-form" class="data-form">
        <h3 id="data-form-title">새 데이터 추가</h3>
        <div class="fields">
          <label>날짜 <input id="f-date" type="date" required /></label>
          <label>값(원) <input id="f-value" type="number" step="0.01" min="500" max="3000" placeholder="1350.25" required /></label>
          <label class="grow">메모 <input id="f-memo" type="text" maxlength="200" placeholder="예: FOMC 발표" /></label>
        </div>
        <div class="form-actions">
          <button id="data-submit" class="primary-btn" type="submit">추가</button>
          <button id="data-cancel" class="ghost-btn" type="button" hidden>취소</button>
          <span id="data-msg" class="form-msg" role="status"></span>
        </div>
      </form>

      <div class="table-tools">
        <div class="filters">
          <label>시작 <input id="q-start" type="date" /></label>
          <label>종료 <input id="q-end" type="date" /></label>
          <button id="q-apply" class="ghost-btn" type="button">조회</button>
          <button id="q-reset" class="ghost-btn" type="button">초기화</button>
        </div>
        <div class="exports">
          <button id="export-csv" class="ghost-btn" type="button">⬇ CSV</button>
          <button id="export-json" class="ghost-btn" type="button">⬇ JSON</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>날짜</th><th class="num">값(원)</th><th class="num">전일 대비</th><th>메모</th><th></th></tr></thead>
          <tbody id="data-tbody"></tbody>
        </table>
      </div>
      <div class="table-foot">
        <span id="data-count"></span>
        <button id="data-more" class="ghost-btn" type="button" hidden>더 보기</button>
      </div>
    </section>

    <!-- 대화 기록 -->
    <section id="tab-history" class="panel" role="tabpanel" hidden>
      <div class="section-head">
        <h3>이전 대화 <small>불러오면 이어서 대화할 수 있어요</small></h3>
        <button id="history-refresh" class="ghost-btn" type="button">새로고침</button>
      </div>
      <ul id="history-list" class="history-list"></ul>
    </section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
